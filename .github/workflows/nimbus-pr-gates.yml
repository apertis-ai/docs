# Nimbus migration PR gates (issue #12). Non-mutating: no secrets, no deploy, no database, no index.
# Every job builds what it checks from the checked-out commit and writes only inside its own runner.
# Documentation: migration/nimbus/acceptance/README.md
name: nimbus-pr-gates

on:
  pull_request:
    paths:
      - 'site-nimbus/**'
      - 'docs/**'
      - 'docs-api/**'
      - 'src/**'
      - 'blog/**'
      - 'static/**'
      - 'functions/**'
      - 'assistant/**'
      - 'indexer/**'
      - 'supabase/migrations/**'
      - 'migration/nimbus/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docusaurus.config.js'
      - 'babel.config.js'
      - 'sidebars.js'
      - 'sidebarsApi.js'
      - '.github/workflows/nimbus-*.yml'
  push:
    branches: [main, 'claude/nimbus-**']
    paths:
      - 'site-nimbus/**'
      - 'docs/**'
      - 'docs-api/**'
      - 'src/**'
      - 'blog/**'
      - 'static/**'
      - 'functions/**'
      - 'assistant/**'
      - 'indexer/**'
      - 'supabase/migrations/**'
      - 'migration/nimbus/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docusaurus.config.js'
      - 'babel.config.js'
      - 'sidebars.js'
      - 'sidebarsApi.js'
      - '.github/workflows/nimbus-*.yml'

permissions:
  contents: read

concurrency:
  group: nimbus-pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
  PLAYWRIGHT_VERSION: '1.63.0'

jobs:
  legacy:
    name: legacy build + activation guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run test:developer-activation

  candidate:
    name: candidate build, typecheck, tests, publication hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false } # sourceSha needs full history (#7)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '25', cache: npm, cache-dependency-path: site-nimbus/package-lock.json }
      - run: npm ci
        working-directory: site-nimbus
      - name: build (fails on a stale committed manifest)
        run: CI=1 npm run build
        working-directory: site-nimbus
      - name: conversion is deterministic (the build changed no tracked file)
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - run: npm run typecheck
        working-directory: site-nimbus
      - run: npm test
        working-directory: site-nimbus
      - run: npm run test:dist
        working-directory: site-nimbus
      - name: activation guard over legacy and candidate roots, including dist
        run: node scripts/check-developer-activation.mjs

  preview:
    name: preview-served routes, browser checks and search relevance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PREVIEW_URL: http://127.0.0.1:8788
      PLAYWRIGHT_CHANNEL: bundled # Playwright's own Chromium in CI; local runs keep system Chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '25', cache: npm, cache-dependency-path: '**/package-lock.json' }
      - name: install (root for the Pages Function, site-nimbus for the build and wrangler)
        run: |
          npm ci
          npm ci --prefix site-nimbus
      - run: CI=1 npm run build
        working-directory: site-nimbus
      - name: Playwright outside the repository (no lockfile change)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT=$GITHUB_WORKSPACE/scripts/nimbus/playwright-channel.mjs" >> "$GITHUB_ENV"
      - name: serve the candidate with the root Pages Function (no .dev.vars)
        run: |
          (cd site-nimbus && nohup npm run preview -- --port 8788 --ip 127.0.0.1 > "$RUNNER_TEMP/preview.log" 2>&1 &)
          for i in $(seq 1 90); do curl -fs -o /dev/null "$PREVIEW_URL/" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/preview.log"; exit 1
      - run: npm run test:routes
        working-directory: site-nimbus
      - name: route, redirect, canonical and anchor fixtures (PoC scope)
        run: node scripts/nimbus/route-fixtures.mjs check "$PREVIEW_URL" --scope poc
      - run: npm run test:m3-browser
        working-directory: site-nimbus
      - run: node --test test/m4-e2e.test.ts
        working-directory: site-nimbus
      - name: search relevance, 14/14 PoC queries with keyboard focus
        run: |
          node scripts/nimbus/measure.mjs search "$PREVIEW_URL" --scope poc > "$RUNNER_TEMP/search.json"
          jq -e '(.rows | length == 14) and (.rows | all(.pass)) and .keyboardFocus == true' "$RUNNER_TEMP/search.json"

  assistant:
    name: assistant contract/compat/failure tests (+ indexer when present)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false } # the legacy handler is read from 7b6ef85
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '25', cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci
      - run: node --test --test-timeout=10000 'assistant/test/*.test.ts'
      - name: new client against the deployed legacy handler
        run: node --test --test-timeout=20000 migration/nimbus/acceptance/new-client-old-server.test.ts
      - id: indexer
        name: indexer present?
        run: if [ -f indexer/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "indexer/ absent, its gate does not apply"; fi
      - name: indexer tests (local PGlite replica, no network)
        if: steps.indexer.outputs.present == 'true'
        run: |
          npm ci --prefix site-nimbus
          (cd site-nimbus && CI=1 npm run build)
          cd indexer
          npm ci
          node --test --test-timeout=120000 'test/*.test.ts'
      - name: indexer dry run (no credentials, no writes)
        if: steps.indexer.outputs.present == 'true'
        run: |
          node indexer/index.ts --environment preview --dry-run --receipt "$RUNNER_TEMP/dry.json"
          jq -e --slurpfile m site-nimbus/src/manifest/manifest.json '.ok and .buildId == $m[0].buildId
            and .documents.planned == ([$m[0].documents[] | select(.eligibility.rag)] | length)
            and .documents.planned + .documents.excluded == ($m[0].documents | length)' "$RUNNER_TEMP/dry.json"

  gate-mutants:
    name: the gates detect injected regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '25', cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: |
          npm ci
          npm ci --prefix site-nimbus
      - run: CI=1 npm run build
        working-directory: site-nimbus
      - run: node scripts/nimbus/gate-mutants.mjs --port 8805
      - name: every mutant was restored
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all -- site-nimbus/src migration assistant functions)"

  policy:
    name: workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '25', cache: npm }
      - run: npm ci
      - run: node scripts/nimbus/acceptance.mjs --only workflow-policy --sha "$GITHUB_SHA"
